name: english_word_carousel
description: A cross-platform vocabulary carousel app
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^3.8.5
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  audioplayers: ^5.2.1
  uuid: ^4.4.0
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  window_manager: ^0.5.1
  flutter_acrylic: ^1.1.4
  tray_manager: ^0.5.2
  hotkey_manager: ^0.2.3
  excel: ^4.0.6
  file_picker: ^10.3.3
  supabase_flutter: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/supabase.json
  fonts:
    - family: Orbitron
      fonts:
        - asset: fonts/Orbitron.ttf
          weight: 400
